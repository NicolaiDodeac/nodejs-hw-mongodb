tags:
  - Contacts
summary: Create contact
operationId: create_contact
description: 'Create a contact with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - _id
          - name
          - phoneNumber
          - email
          - contactType
        properties:
          _id:
            description: "Contact's id"
            type: string
            example: 67235d854039497620fd770b
          name:
            description: "Contact's name"
            type: string
            example: 'Nicolai Dodeac'
          phoneNumber:
            description: "Contact's phoneNumber"
            type: string
            example: '+447918599645'
          email:
            description: "Contact's email"
            type: string
            example: 'Mykola.Dodiak@gmail.com'
          contactType:
            description: "Contact's type"
            type: string
            enum: ['work', 'home', 'personal']
          isFavourite:
            description: 'Whether is contact favorite'
            type: boolean
            example: false
          userId:
            description: "Contact's userId"
            type: string
            example: 67235d854039497620fd770b
          photo:
            description: "Link to Contact's photo"
            type: string
            format: binary
responses:
  '201':
    description: Creates a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              type: object
              $ref: ../../components/schemas/contact.yaml
  '401':
    $ref: ../../components/responses/401.yaml
  '404':
    $ref: ../../components/responses/404.yaml
