tags:
  - Contacts
summary: Update contact by id
operationId: updateContact
description: Update contact information by id
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
requestBody:
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            description: "Contact's name"
            example: 'Updated Name'
          phoneNumber:
            type: string
            description: "Contact's phoneNumber"
            example: '+447918599645'
          email:
            type: string
            description: "Contact's email"
            example: 'updated.email@gmail.com'
          isFavourite:
            type: boolean
            description: 'Whether contact is favorite'
            example: true
responses:
  '200':
    description: Successfully updated contact
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Contact updated successfully
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
